<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holiday Tracker Login</title><link rel="stylesheet" href="assets/style.css"></head><body class="login"><main class="card"><h1>Company Holiday Tracker</h1><p>Sign in with your employee name and password</p><form id="login"><label>Name</label><input id="name" required autocomplete="username"><label>Password</label><input id="pw" type="password" required autocomplete="current-password"><button>Sign in</button></form><p id="message"></p><small>Forgotten password? <button type="button" class="linkbtn" onclick="resetPw()">Email me a reset link</button> (needs your email in the Name box) or contact an administrator.</small></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>document.getElementById('login').onsubmit=signIn</script></body></html>
