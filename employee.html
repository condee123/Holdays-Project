<!doctype html>
<html lang="en-GB">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My holidays</title>
  <link rel="stylesheet" href="assets/style.css?v=6">
</head>

<body data-page="employee">
  <header class="topbar">
    <a class="brand" href="employee.html">Holiday Tracker</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <h1 id="hello">My holidays</h1>
    <p id="yearInfo" class="lead"></p>

    <section class="card">
      <h2>My allowance</h2>
      <div id="tiles" class="tiles"></div>
      <p id="breakdown" class="lead"></p>
    </section>

    <section class="card">
      <h2>Request a holiday</h2>
      <form id="request">
        <div class="form-grid">
          <div>
            <label for="employee">Employee</label>
            <input id="employee" readonly>
          </div>
          <div>
            <label for="kind">Leave</label>
            <select id="kind">
              <option value="FULL">Full day(s)</option>
              <option value="AM">Half day AM</option>
              <option value="PM">Half day PM</option>
            </select>
          </div>
          <div>
            <label for="start">Start</label>
            <input id="start" type="date" required>
          </div>
          <div>
            <label for="end">End <span class="hint">(ignored for half days)</span></label>
            <input id="end" type="date" required>
          </div>
          <div class="wide">
            <label class="check" id="birthdayLabel" for="birthday">
              <input id="birthday" type="checkbox">
              Use my birthday day
            </label>
            <span id="birthdayNote" class="hint"></span>
          </div>
          <div class="wide">
            <label for="reason">Reason (optional)</label>
            <textarea id="reason" rows="2"></textarea>
          </div>
        </div>
        <button type="submit">Submit for approval</button>
        <p id="preview" class="note"></p>
        <p id="note" class="note" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <h2>My requests</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Dates</th>
              <th scope="col">Days</th>
              <th scope="col">Status</th>
              <th scope="col">Reason</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Recorded leave</h2>
      <p class="lead">Entries added by an administrator (annual leave, sickness, etc.).</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Type</th>
              <th scope="col">Days</th>
              <th scope="col">Notes</th>
            </tr>
          </thead>
          <tbody id="logRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/config.js?v=6"></script>
  <script src="assets/app.js?v=6"></script>
</body>

</html>
