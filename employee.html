<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees</title><link rel="stylesheet" href="assets/style.css"></head><body><header><b>Holiday Tracker · Admin</b><nav><a href="admin.html">Approvals</a><a href="employees.html">Employees</a><a href="calendar.html">Calendar</a><button onclick="logout()">Log out</button></nav></header><main><h1>Employees</h1><section class="card"><h2>Add employee</h2><form id="newEmp"><label>Full name</label><input id="ename" required><label>Login email (optional – leave blank to log in by name; a real email allows self-service password reset)</label><input id="eemail" type="email"><label>Temporary password (10+ characters)</label><input id="epw" required minlength="10"><label>Role</label><select id="erole"><option value="employee">Employee</option><option value="admin">Admin</option></select><label>Department</label><input id="edept"><label>Team</label><select id="eteam"><option>5-Day Week</option><option>Team 1</option><option>Team 2</option></select><label>Start date</label><input id="estart" type="date"><label>Allowance days</label><input id="eallow" type="number" step="0.5" value="28"><label>Carryover days</label><input id="ecarry" type="number" step="0.5" value="0"><label>Bank-holiday accrual days</label><input id="eaccr" type="number" step="0.5" value="0"><label>Long-service days</label><input id="elong" type="number" step="0.5" value="0"><button>Create account</button><p id="note"></p></form></section><section class="card"><h2>Current employees</h2><table><thead><tr><th>Name</th><th>Initials</th><th>Team</th><th>Allowance</th><th>Carryover</th><th>Accrual</th><th>Long service</th></tr></thead><tbody id="emps"></tbody></table><p>To edit allowances, change the employee document in the Firestore console.</p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>loadEmployees()</script></body></html>
