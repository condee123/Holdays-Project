<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My holidays</title><link rel="stylesheet" href="assets/style.css"></head><body><header><b>Holiday Tracker</b><nav><a href="employee.html">My holidays</a><a href="calendar.html">Calendar</a><button onclick="logout()">Log out</button></nav></header><main><h1 id="hello">My holidays</h1><section class="card"><h2>Available balance: <span id="balance">—</span> days</h2><h2>Request a holiday</h2><form id="request"><label>Employee</label><input id="employee" readonly><label>Leave</label><select id="kind"><option value="FULL">Full day(s)</option><option value="AM">Half day AM</option><option value="PM">Half day PM</option></select><label>Start</label><input id="start" type="date" required><label>End</label><input id="end" type="date" required><label>Reason</label><textarea id="reason"></textarea><button>Submit for approval</button><p id="note"></p></form></section><section class="card"><h2>My requests</h2><table><thead><tr><th>Dates</th><th>Days</th><th>Status</th><th>Reason</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>loadEmployee()</script></body></html>
