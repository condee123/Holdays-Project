<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password</title>
  <link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body class="login-page" data-page="change">
  <main class="card login-card">
    <h1>Choose a new password</h1>
    <p class="lead">Please set your own password before continuing (at least 10 characters).</p>

    <form id="change">
      <label for="pw1">New password</label>
      <input id="pw1" type="password" required minlength="10" autocomplete="new-password">

      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" required minlength="10" autocomplete="new-password">

      <button type="submit">Save password</button>
    </form>
    <p id="message" class="note" role="status" aria-live="polite"></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/config.js?v=8"></script>
  <script src="assets/app.js?v=8"></script>
</body>
</html>
