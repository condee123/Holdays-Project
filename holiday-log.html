<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holiday log</title>
  <link rel="stylesheet" href="assets/style.css?v=7">
</head>
<body data-page="log">
  <header class="topbar">
    <a class="brand" href="employee.html">Holiday Tracker</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <h1>Holiday log</h1>
    <p class="lead">Quick entry for annual leave, sickness and other absence. Only <b>Annual Leave</b> entries reduce the allowance; <b>Sick Leave</b> feeds the Bradford Factor.</p>

    <section class="card">
      <h2>Add entry</h2>
      <form id="logForm">
        <div class="form-grid">
          <div><label for="lemp">Employee</label><select id="lemp"></select></div>
          <div><label for="ldate">Date</label><input id="ldate" type="date" required></div>
          <div><label for="ltype">Leave type</label><select id="ltype"></select></div>
          <div><label for="ldays">Days</label><input id="ldays" type="number" step="0.5" min="0.5" value="1" required></div>
          <div class="wide"><label for="lnotes">Notes</label><input id="lnotes"></div>
        </div>
        <button type="submit">Add entry</button>
        <p id="note" class="note" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Entries</h2>
        <select id="lfilter" aria-label="Filter by employee"></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Employee</th><th>Type</th><th>Days</th><th>Notes</th><th></th></tr></thead>
          <tbody id="logRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/config.js?v=7"></script>
  <script src="assets/app.js?v=7"></script>
</body>
</html>
